name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, check, and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and lint
        run: bun run style:check

      - name: Run tests
        run: bun test

      - name: Install Chromium for scaffold E2E
        working-directory: packages/cli
        run: bunx playwright install --with-deps chromium

      - name: Run scaffold workflow E2E
        run: bun run --cwd packages/cli e2e

      - name: Upload scaffold E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scaffold-e2e-artifacts
          path: packages/cli/test-results/
          if-no-files-found: ignore

      - name: Type-check workspaces
        run: bun run check

      - name: Build reference dashboard
        run: bun run build

      - name: Compile public CLI package
        run: bun run --cwd packages/cli compile
